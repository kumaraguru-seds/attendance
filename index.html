<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDS Attendance Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container" id="login-view">
        <div class="login-card">
            <h2>SEDS Login</h2>
            <form onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Official Email ID" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Secure Login</button>
                <p id="error-msg" style="color:red; margin-top:15px; font-size:0.9em;"></p>
            </form>
        </div>
    </div>

    <div id="app-view" class="hidden">
        <header>
            <div class="user-info">
                <img id="header-avatar" class="user-header-profile" src="" alt="User">
                <div class="user-text">
                    <h2 id="welcome-msg">Welcome</h2>
                    <div style="font-size:0.85rem; color:#666; font-weight:600; margin-top:2px;" id="user-roll"></div>
                    <div style="margin-top:4px;">
                        <span id="role-badge" class="role-badge">Lead</span>
                        <span id="team-badge" class="team-badge">Team</span>
                    </div>
                </div>
            </div>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </header>

        <div id="member-dashboard" class="hidden">
            <h3>My Attendance Stats</h3>
            <div class="stats-overview">
                <div class="percentage-circle">
                    <span class="big-percent" id="overall-percent">0%</span>
                    <small>Overall</small>
                </div>
            </div>
            <div class="grid-container" id="member-stats-grid"></div>
        </div>

        <div id="lead-dashboard" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Mark Attendance</h3>
                <input type="date" id="att-date" readonly style="padding:8px; border-radius:6px; border:1px solid #ddd; background:#f3f4f6;">
            </div>
            
            <div class="grid-container" id="members-grid"></div>
            
            <div class="discussion-box">
                <h3>Meeting Minutes</h3>
                <textarea id="discussion-text" placeholder="What was discussed today?"></textarea>
                <br><br>
                <button class="btn btn-primary" id="submit-btn" onclick="submitAttendance()">Submit & Notify Team</button>
            </div>

            <div class="history-section">
                <h3>Previous Sessions (History)</h3>
                <div id="history-container">
                    <p style="color:#666">Loading previous data...</p>
                </div>
            </div>
        </div>

        <div id="admin-dashboard" class="hidden">
            <h3>Admin Pro Analytics</h3>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="filter-text" style="padding:10px; flex:1;" placeholder="Search..." onkeyup="filterTable()">
                <input type="date" id="filter-date" style="padding:10px;" onchange="filterTable()">
            </div>
            <div style="overflow-x:auto; background:white; border-radius:12px;">
                <table id="admin-table">
                    <thead><tr><th>Date</th><th>Team</th><th>Name</th><th>Status</th><th>Discussion</th><th>Email</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
