<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>SEDS Attendance Portal</title>

   <meta name="description" content="Kumaraguru SEDS is a student-led organization at Kumaraguru Institutions dedicated to space exploration, astronomy, and aerospace engineering through projects, workshops, and events, seds, kumaraguru, KCT SEDS">
  <!-- Meta Keywords -->
  <meta name="keywords" content="Kumaraguru SEDS, KCT SEDS, space exploration, astronomy club, aerospace engineering, student space projects, satellite design, rocketry, astrophysics, Kumaraguru Institutions">
  <link rel="icon" href="sedsb.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="author" content="Manikandan N">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kumaraguruseds.space/">
  <meta property="og:title" content="Kumaraguru SEDS">
  <meta property="og:description" content="Kumaraguru SEDS is a student-driven chapter dedicated to space exploration, astronomy, and aerospace innovation. We conduct hands-on workshops, stargazing sessions, and technical projects to inspire curiosity and scientific learning. Our mission is to empower young minds to explore the universe and contribute to the advancement of space science and technology.">
  <meta property="og:image" content="https://kumaraguruseds.space/sedsb.png">
  <link rel="icon" href="src/img/SEDS3.png" type="image/png">
  <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="login-container" id="login-view">
        <div class="login-card">
            <h2>SEDS Login</h2>
            <form onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group">
                   <input type="text" id="email" placeholder="Email ID or Roll Number" autocomplete="username" required>
                </div>
                <div class="input-group" style="position: relative;">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button type="button" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666; display: flex; align-items: center; padding: 0;">
        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg id="eyeClosed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
    </button>
</div>

                <button type="submit" class="btn btn-primary" style="width:100%">Secure Login</button>
                <p id="error-msg" style="color:red; margin-top:15px; font-size:0.9em;"></p>
            </form>
        </div>
    </div>

    <div id="app-view" class="hidden">
        <header>
            <div class="user-info">
                <img id="header-avatar" class="user-header-profile" src="" alt="User">
                <div class="user-text">
                    <h2 id="welcome-msg">Welcome</h2>
                    <div style="font-size:0.85rem; color:#666; font-weight:600; margin-top:2px;" id="user-roll"></div>
                    <div style="margin-top:4px;">
                        <span id="role-badge" class="role-badge">Lead</span>
                        <span id="team-badge" class="team-badge">Team</span>
                    </div>
                </div>
            </div>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </header>

        <div id="member-dashboard" class="hidden">
            <h3>My Attendance Stats</h3>
            <div class="stats-overview">
                <div class="percentage-circle">
                    <span class="big-percent" id="overall-percent">0%</span>
                    <small>Overall</small>
                </div>
            </div>
            <div class="grid-container" id="member-stats-grid"></div>
        </div>

        <div id="lead-dashboard" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Mark Attendance</h3>
                <input type="date" id="att-date" readonly style="padding:8px; border-radius:6px; border:1px solid #ddd; background:#f3f4f6;">
            </div>
            
            <div class="grid-container" id="members-grid"></div>
            
            <div class="discussion-box">
                <h3>Meeting Minutes</h3>
                <textarea id="discussion-text" placeholder="What was discussed today?"></textarea>
                <br><br>
                <button class="btn btn-primary" id="submit-btn" onclick="submitAttendance()">Submit & Notify Team</button>
            </div>

            <div class="history-section">
                <h3>Previous Sessions (History)</h3>
                <div id="history-container">
                    <p style="color:#666">Loading previous data...</p>
                </div>
            </div>
        </div>

        <div id="admin-dashboard" class="hidden">
            <h3>Admin Pro Analytics</h3>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="filter-text" style="padding:10px; flex:1;" placeholder="Search..." onkeyup="filterTable()">
                <input type="date" id="filter-date" style="padding:10px;" onchange="filterTable()">
            </div>
            <div style="overflow-x:auto; background:white; border-radius:12px;">
                <table id="admin-table">
                    <thead><tr><th>Date</th><th>Team</th><th>Name</th><th>Status</th><th>Discussion</th><th>Email</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
    
    // Toggle Password Visibility
    const toggleBtn = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');
    const eyeOpen = document.querySelector('#eyeOpen');
    const eyeClosed = document.querySelector('#eyeClosed');

    toggleBtn.addEventListener('click', function () {
    const isPassword = passwordInput.type === 'password';
    
    // Toggle type
    passwordInput.type = isPassword ? 'text' : 'password';
    
    // Toggle SVG display
    eyeOpen.style.display = isPassword ? 'none' : 'block';
    eyeClosed.style.display = isPassword ? 'block' : 'none';
        
   });

    
    </script>
</body>
</html>
